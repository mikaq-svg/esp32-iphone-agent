name: Build unsigned IPA

# 在 GitHub 的免费 macOS 机器上编译，产出未签名 .ipa
# 不需要 Mac、不需要 Apple 开发者账号
on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [main, master]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示环境
        run: |
          xcodebuild -version
          echo "---"
          sw_vers

      - name: 编译（不签名）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project IPhoneAgent.xcodeproj \
            -scheme IPhoneAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/app.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tail -120

      - name: 打包成 .ipa
        working-directory: ios
        run: |
          set -e
          APP="build/app.xcarchive/Products/Applications/IPhoneAgent.app"
          echo "=== 检查产物 ==="
          if [ ! -d "$APP" ]; then
            echo "❌ 没找到 .app，列出 xcarchive 内容："
            find build/app.xcarchive -maxdepth 4 -name "*.app" -o -maxdepth 4 -name "*.appex" | head
            exit 1
          fi
          ls -la "$APP" | head -20
          echo
          echo "=== 打包 ==="
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry IPhoneAgent-unsigned.ipa Payload
          echo "✅ 打包完成"
          ls -lh IPhoneAgent-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: IPhoneAgent-unsigned-ipa
          path: ios/build/IPhoneAgent-unsigned.ipa
          retention-days: 7
