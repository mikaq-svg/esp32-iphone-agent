name: Build unsigned IPA

# 在 GitHub 的免费 macOS 机器上编译，产出未签名 .ipa
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示环境
        run: |
          xcodebuild -version
          echo "---"
          sw_vers
          echo "--- 可用的 Xcode ---"
          ls /Applications | grep -i xcode || true

      - name: 诊断工程（列出 scheme 和配置）
        working-directory: ios
        run: |
          echo "=== 工程文件版本 ==="
          grep -m1 "objectVersion" IPhoneAgent.xcodeproj/project.pbxproj || true
          echo
          echo "=== xcodebuild -list ==="
          xcodebuild -list -project IPhoneAgent.xcodeproj 2>&1 || true
          echo
          echo "=== 共享 scheme ==="
          ls -la IPhoneAgent.xcodeproj/xcshareddata/xcschemes/ 2>&1 || true

      - name: 编译（不签名）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project IPhoneAgent.xcodeproj \
            -scheme IPhoneAgent \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/app.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee /tmp/build.log | tail -200
          echo
          echo "=== 错误摘要（如果有） ==="
          grep -iE "error:|failed|unable to|no such|not found" /tmp/build.log | head -30 || echo "没有匹配的错误关键词"

      - name: 把错误写进运行摘要（页面直接可见）
        if: failure()
        run: |
          echo "## ❌ 编译失败" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Xcode 版本" >> $GITHUB_STEP_SUMMARY
          xcodebuild -version >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 错误行" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/build.log ]; then
            grep -iE "error:|fatal|failed to|unable to|no such module|cannot find" /tmp/build.log | head -40 >> $GITHUB_STEP_SUMMARY || echo "(没匹配到错误关键词)" >> $GITHUB_STEP_SUMMARY
          else
            echo "(build.log 不存在)" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 最后 60 行" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -60 /tmp/build.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 打包成 .ipa
        if: success()
        working-directory: ios
        run: |
          set -e
          APP="build/app.xcarchive/Products/Applications/IPhoneAgent.app"
          echo "=== 检查产物 ==="
          if [ ! -d "$APP" ]; then
            echo "❌ 没找到 .app"
            find build -maxdepth 5 -name "*.app" -o -maxdepth 5 -name "*.appex" | head
            exit 1
          fi
          ls -la "$APP" | head -20
          echo
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry IPhoneAgent-unsigned.ipa Payload
          echo "✅ 打包完成"
          ls -lh IPhoneAgent-unsigned.ipa

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IPhoneAgent-unsigned-ipa
          path: ios/build/IPhoneAgent-unsigned.ipa
          retention-days: 7

      - name: 失败时也上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 3
